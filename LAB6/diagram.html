<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Николаева Алёна. Лабораторная 6</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script>
        function showDiagram() {
            let data = [36, 86, 23, 224, 24, 90, 38, 24, 56, 73]
            let colors = ['red', 'black', 'green', 'white', 'blue', 'gray', 'violet', 'pink', 'yellow', 'orange']
            let bars = document.getElementsByClassName('bar');
            const diagWidth = document.getElementById('diag').clientWidth;
            const maxData = Math.max(...data);
            const k = diagWidth / maxData * 0.9;
            for (let i = 0; i < data.length; i++){
                bars[i].style.height = k*data[i] + 'px';
                bars[i].style.backgroundColor = colors[i];
                bars[i].innerHTML = '<h3 style="text-align: center;">' + data[i] + '</h3>';
            }
        }
    </script>
    <style>
        #diag {
            display: flex;
            align-items: flex-end;
            width: 500px;
            height: 500px;
            background-color: aliceblue;
            border: 2px solid black;
        }
        .bar {
            width: 50px;
            background-color: blue;
            border: 2px solid lightblue;
        }
    </style>
</head>
<body onload="showDiagram()">
    <header>НГТУ, ФБ, Лабораторная работа 6</header>
    <main>
        <div id="diag">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
    </main>

    </footer>
</body>
</html>
