<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Николаева Алёна. Лабораторная 5 (Event)</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <style>
        #block {
            width: 300px;
            height: 300px;
            border: 2px solid black;
            background: white;
            cursor: crosshair;
            font-family: Arial, Helvetica, sans-serif;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
    <script>
        function showCoords() {
            let e = this.event;
            let x = this.event.x;
            let y = this.event.y;
            let div = document.getElementById('block');
            
            if (e.ctrlKey) {
                div.style.color = 'red';
            } else {
                div.style.color = 'black';
            }
            if (e.altKey) {
                div.style.backgroundColor = 'green';
            } else {
                div.style.backgroundColor = 'white';
            }
            if (e.shiftKey) {
                div.style.border = '4px solid blue';
            } else {
                div.style.border = '2px solid black';
            }
        
            let output = '<b>x</b> = ' + x + 'px<br><b>y</b> = ' + y + 'px<br><br>';
            if (e.ctrlKey) {
                output += 'Нажата клавиша Ctrl<br>';
            }
            if (e.altKey) {
                output += 'Нажата клавиша Alt<br>';
            }
            if (e.shiftKey) {
                output += 'Нажата клавиша Shift<br>';
            }
            if (!e.ctrlKey && !e.altKey && !e.shiftKey) {
                output += 'Клавиши не нажаты';
            }
            
            div.innerHTML = output;
        }
    </script>
</head>
<body>
    <header>НГТУ, ФБ, Лабораторная работа 5</header>
    <main>
        <div id="block" onmousemove="showCoords()"></div>
    </main>
    <footer>
        &copy; Алёна Николаева, ФБИ-41, 2 курс, 2026
    </footer>
</body>
</html>
